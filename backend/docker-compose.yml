services:
  gateway:
    container_name: gateway
    hostname: gateway
    restart: always
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    expose:
      - 8080
    env_file:
      - ./gateway/.env.docker
    networks:
      - backbone

  analytics:
    container_name: analytics
    hostname: analytics
    restart: always
    build:
      context: ./analytics
    ports:
      - "8082:8082"
    expose:
      - 8082
    env_file:
      - ./analytics/.env
    networks:
      - backbone

  accounting:
    container_name: accounting
    hostname: accounting
    restart: always
    build:
      context: ./accounting
    ports:
      - "8081:8081"
    expose:
      - 8081
    env_file:
      - ./accounting/.env
    networks:
      - backbone

networks:
  backbone:
    driver: bridge
