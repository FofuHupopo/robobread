upstream server {
	server server:8000;
}

upstream interaction {
	server interaction:8001;
}

upstream terminal {
	server server:8002;
}

upstream packing {
	server packing:8003;
}

upstream analytics {
	server analytics:8004;
}

server {
	listen 80;
	listen [::]:80;

	server_name 127.0.0.1 localhost 192.168.114.11;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	location / {
		root /var/www/robobread/client/dist;
		index index.html;
		try_files $uri $uri/ /index.html;
	}

	location /api {
		proxy_pass http://server/api;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	location /admin {
		proxy_pass http://server/admin;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	location /media/ {
		proxy_pass http://server/media;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	location /static/ {
		proxy_pass http://server/static;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

	# location /media/ {
	# 	alias /var/www/robobread/server/media/;
	# }

	# location /static/ {
	# 	alias /var/www/robobread/server/static/;
	# }
}
