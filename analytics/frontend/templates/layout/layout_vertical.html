{% extends 'layout/master.html' %}


{% block layout %}
<!-- Layout wrapper: Start -->
<div class="layout-wrapper layout-content-navbar {{ is_menu|yesno:',layout-with-menu' }}">
  <div class="layout-container">

    <!-- Menu: Start -->
    {% include "layout/partials/menu/menu.html" %}
    <!-- Menu: End -->

    <!-- Layout page: Start -->
    <div class="layout-page">
      <!-- Navbar: Start -->
      {% include "layout/partials/navbar/navbar.html" %}
      <!-- Navbar: End -->

      <!-- Content wrapper: Start -->
      <div class="content-wrapper">
        <!-- Content: Start -->
        
          <div class="container-fluid flex-grow-1 container-p-y">
        
            {% block content %}
            {% endblock content %}

          </div>
          <!-- / Content: End -->

          <div class="content-backdrop fade"></div>
        </div>
        <!--/ Content wrapper: End -->
      </div>
      <!-- / Layout page: End -->
    </div>


    <!-- Overlay -->
    <div class="layout-overlay layout-menu-toggle"></div>

  </div>
  <!-- Layout wrapper: End -->
  {% endblock layout %}
